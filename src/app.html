<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			(function() {
				'use strict';
				function sendToAPI(body) {
					try {
						if (navigator.sendBeacon) {
							navigator.sendBeacon('/api/log', body);
						} else {
							var x = new XMLHttpRequest();
							x.open('POST', '/api/log', true);
							x.setRequestHeader('Content-Type', 'application/json');
							x.send(body);
						}
					} catch(e) {}
					// img beacon fallback (guaranteed to fire even on crash)
					try {
						var img = new Image();
						img.src = '/api/log?body=' + encodeURIComponent(body);
					} catch(e) {}
				}
				// Heartbeat: log that the inline script ran
				sendToAPI(JSON.stringify([{timestamp: new Date().toISOString(), level: 'info', message: 'app.html: inline script executed', url: window.location.href}]));
				var q = window.__earlyErrors = [];
				var orig = console.error.bind(console);
				console.error = function() {
					orig.apply(console, arguments);
					var msg = Array.prototype.map.call(arguments, String).join(' ');
					q.push({ t: Date.now(), m: msg, s: new Error().stack });
					sendToAPI(JSON.stringify([{timestamp: new Date().toISOString(), level: 'error', message: msg, stack: new Error().stack, url: window.location.href}]));
				};
				window.addEventListener('error', function(e) {
					var msg = e.error ? (e.error.message || String(e.error)) : (e.message || 'error');
					var st = e.error ? e.error.stack : undefined;
					sendToAPI(JSON.stringify([{timestamp: new Date().toISOString(), level: 'error', message: msg, stack: st, url: window.location.href}]));
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					sendToAPI(JSON.stringify([{timestamp: new Date().toISOString(), level: 'error', message: r ? (r.message || String(r)) : 'rejection', stack: r ? r.stack : undefined, url: window.location.href}]));
				});
				window.addEventListener('load', function() {
					sendToAPI(JSON.stringify([{timestamp: new Date().toISOString(), level: 'info', message: 'app.html: load event fired', url: window.location.href}]));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
