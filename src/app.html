<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#f4f3f1" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<script>
			(function() {
				'use strict';
				var KEY = '__logs';
				var MAX = 2000;
				var buf = [];
				try { buf = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { buf = []; }
				function save() {
					try { localStorage.setItem(KEY, JSON.stringify(buf)); } catch(e) {}
				}
				function push(level, msg, stack) {
					buf.push({t:Date.now(),l:level,m:(msg||'').slice(0,5000),s:stack?stack.slice(0,10000):undefined,u:window.location.href});
					if (buf.length>MAX) buf=buf.slice(buf.length-MAX);
					save();
				}
				['log','info','warn','error'].forEach(function(l) {
					var orig = console[l].bind(console);
					console[l] = function() {
						orig.apply(console, arguments);
						push(l, Array.prototype.map.call(arguments, String).join(' '));
					};
				});
				window.addEventListener('error', function(e) {
					push('error', e.error ? (e.error.message||String(e.error)) : (e.message||'error'), e.error ? e.error.stack : undefined);
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					push('error', r ? (r.message||String(r)) : 'Unhandled rejection', r ? r.stack : undefined);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the saved theme before first paint (stores/theme.ts takes over after hydration).
			(function () {
				var mode = 'system', oled = false;
				try { var s = JSON.parse(localStorage.getItem('appSettings') || '{}'); mode = s.themeMode || mode; oled = !!s.oled; } catch (e) {}
				var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
					|| (mode === 'adaptive' && (new Date().getHours() < 7 || new Date().getHours() >= 20));
				document.body.className = dark ? (oled ? 'oled' : 'dark') : 'light';
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
