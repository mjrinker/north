<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			(function() {
				'use strict';
				function sendNow(level, message, stack) {
					try {
						var body = JSON.stringify([{timestamp: new Date().toISOString(), level: level, message: message || '', stack: stack, url: window.location.href}]);
						navigator.sendBeacon && navigator.sendBeacon('/api/log', body);
					} catch(e) {}
				}
				var q = window.__earlyErrors = [];
				var orig = console.error.bind(console);
				console.error = function() {
					orig.apply(console, arguments);
					var msg = Array.prototype.map.call(arguments, String).join(' ');
					q.push({t:Date.now(), m:msg, s:new Error().stack});
					sendNow('error', msg, new Error().stack);
				};
				window.addEventListener('error', function(e) {
					sendNow('error', e.error ? (e.error.message || String(e.error)) : (e.message || 'error'), e.error ? e.error.stack : undefined);
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					sendNow('error', r ? (r.message || String(r)) : 'rejection', r ? r.stack : undefined);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
