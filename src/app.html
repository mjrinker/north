<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			(function() {
				'use strict';
				var KEY = '__logs';
				var MAX = 500;
				var buf = [];
				try { buf = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { buf = []; }
				function save() {
					try { localStorage.setItem(KEY, JSON.stringify(buf)); } catch(e) {}
				}
				function push(level, msg, stack) {
					buf.push({t:Date.now(),l:level,m:(msg||'').slice(0,5000),s:stack?stack.slice(0,10000):undefined,u:window.location.href});
					if (buf.length>MAX) buf=buf.slice(buf.length-MAX);
					save();
				}
				['log','info','warn','error'].forEach(function(l) {
					var orig = console[l].bind(console);
					console[l] = function() {
						orig.apply(console, arguments);
						push(l, Array.prototype.map.call(arguments, String).join(' '));
					};
				});
				window.addEventListener('error', function(e) {
					push('error', e.error ? (e.error.message||String(e.error)) : (e.message||'error'), e.error ? e.error.stack : undefined);
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					push('error', r ? (r.message||String(r)) : 'Unhandled rejection', r ? r.stack : undefined);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
