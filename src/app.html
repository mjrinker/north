<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			(function() {
				'use strict';
				function sendNow(level, message, stack) {
					var body = JSON.stringify([{
						timestamp: new Date().toISOString(),
						level: level,
						message: message || '',
						stack: stack || undefined,
						url: window.location.href
					}]);
					try {
						if (navigator.sendBeacon) {
							navigator.sendBeacon('/api/log', body);
						} else {
							var x = new XMLHttpRequest();
							x.open('POST', '/api/log', false);
							x.setRequestHeader('Content-Type', 'application/json');
							x.send(body);
						}
					} catch(e) {}
				}
				var q = window.__earlyErrors = [];
				var orig = console.error.bind(console);
				console.error = function() {
					orig.apply(console, arguments);
					var msg = Array.prototype.map.call(arguments, String).join(' ');
					q.push({ t: Date.now(), m: msg, s: new Error().stack });
					sendNow('error', msg, new Error().stack);
				};
				window.addEventListener('error', function(e) {
					var msg = e.error ? (e.error.message || String(e.error)) : (e.message || 'error');
					var st = e.error ? e.error.stack : undefined;
					sendNow('error', msg, st);
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					var msg = r ? (r.message || String(r)) : 'rejection';
					var st = r ? r.stack : undefined;
					sendNow('error', msg, st);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
