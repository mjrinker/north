<!doctype html>
<html lang="en" style="touch-action: manipulation">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			(function() {
				'use strict';
				var q = window.__earlyErrors = [];
				var orig = console.error.bind(console);
				console.error = function() {
					orig.apply(console, arguments);
					q.push({ t: Date.now(), m: Array.prototype.map.call(arguments, String).join(' '), s: new Error().stack });
				};
				window.addEventListener('error', function(e) {
					q.push({ t: Date.now(), m: e.error ? (e.error.message || String(e.error)) : (e.message || 'error'), s: e.error ? e.error.stack : undefined });
				});
				window.addEventListener('unhandledrejection', function(e) {
					var r = e.reason;
					q.push({ t: Date.now(), m: r ? (r.message || String(r)) : 'rejection', s: r ? r.stack : undefined });
				});
				function flush() {
					if (!q.length) return;
					var batch = q.splice(0);
					try {
						navigator.sendBeacon && navigator.sendBeacon('/api/log', JSON.stringify(batch.map(function(e) {
							return { timestamp: new Date(e.t).toISOString(), level: 'error', message: e.m || '', stack: e.s, url: window.location.href };
						})));
					} catch(e) {}
				}
				if (document.readyState === 'complete') flush();
				else window.addEventListener('load', flush);
				window.addEventListener('beforeunload', flush);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
